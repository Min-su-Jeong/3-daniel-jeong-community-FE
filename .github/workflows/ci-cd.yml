name: Node.js CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Fetch API keys from Parameter Store
        run: |
          PARAM_VALUE=$(aws ssm get-parameter --name "${{ secrets.KAKAO_MAP_PARAM_NAME }}" --with-decryption --query "Parameter.Value" --output text --region ${{ secrets.AWS_REGION }} 2>/dev/null || echo "")
          if [ -z "$PARAM_VALUE" ] || [ "$PARAM_VALUE" == "None" ]; then
            echo "Warning: KAKAO_MAP_JAVASCRIPT_KEY not found"
            echo "KAKAO_MAP_JAVASCRIPT_KEY=" >> $GITHUB_ENV
          else
            echo "::add-mask::$PARAM_VALUE"
            echo "KAKAO_MAP_JAVASCRIPT_KEY=$PARAM_VALUE" >> $GITHUB_ENV
          fi
      - name: Build static assets
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BASE_URL: ${{ secrets.CLOUDFRONT_URL }}
        run: |
          set -e
          BUILD_DIR="dist"
          rm -rf ${BUILD_DIR}
          mkdir -p ${BUILD_DIR}
          [ ! -d "public" ] && echo "Error: public directory not found" && exit 1
          cp -r public/* ${BUILD_DIR}/
          
          find ${BUILD_DIR} -type f \( -name ".DS_Store" -o -name "Thumbs.db" -o -name "*.swp" -o -name "*.swo" -o -name "*.bak" \) -delete
          find ${BUILD_DIR} -type d \( -name ".git" -o -name "__pycache__" -o -name ".vscode" -o -name ".idea" \) -exec rm -rf {} + 2>/dev/null || true
          
          if [ -f "${BUILD_DIR}/pages/pool-finder/pool-finder.js" ]; then
            if [ -n "${KAKAO_MAP_JAVASCRIPT_KEY}" ]; then
              sed -i "s|'{{KAKAO_MAP_JAVASCRIPT_KEY}}'|'${KAKAO_MAP_JAVASCRIPT_KEY}'|g" "${BUILD_DIR}/pages/pool-finder/pool-finder.js"
            else
              sed -i "s|'{{KAKAO_MAP_JAVASCRIPT_KEY}}'|''|g" "${BUILD_DIR}/pages/pool-finder/pool-finder.js"
            fi
          fi
          
          cat > ${BUILD_DIR}/config.js <<EOF
          window.APP_CONFIG = {
            KAKAO_MAP_JAVASCRIPT_KEY: "${KAKAO_MAP_JAVASCRIPT_KEY:-}",
            BASE_URL: "${BASE_URL:-}"
          };
          EOF
          
          find ${BUILD_DIR}/pages -name "*.html" -type f | while read htmlfile; do
            if ! grep -q "config.js" "$htmlfile"; then
              sed -i '/<\/head>/i\    <script src="/config.js"></script>' "$htmlfile"
            fi
          done
          
          cat > ${BUILD_DIR}/index.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Community</title>
              <script src="/config.js"></script>
          </head>
          <body>
              <script>window.location.href = '/home';</script>
          </body>
          </html>
          EOF
          
          cat > ${BUILD_DIR}/error.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>404</title>
              <script src="/config.js"></script>
          </head>
          <body>
              <h1>404 - Page Not Found</h1>
              <a href="/home">Go to Home</a>
          </body>
          </html>
          EOF
          
          for page_dir in ${BUILD_DIR}/pages/*/; do
            if [ -d "$page_dir" ]; then
              page_name=$(basename "$page_dir")
              html_file="${page_dir}${page_name}.html"
              if [ -f "$html_file" ]; then
                mkdir -p "${BUILD_DIR}/${page_name}"
                sed -e 's|href="/pages/'"${page_name}"'/|href="/'"${page_name}"'/|g' \
                    -e 's|src="/pages/'"${page_name}"'/|src="/'"${page_name}"'/|g' \
                    -e 's|href="\.\./\.\./|href="/|g' \
                    -e 's|src="\.\./\.\./|src="/|g' \
                    -e 's|href="\.\./|href="/|g' \
                    -e 's|src="\.\./|src="/|g' \
                    -e 's|"'${page_name}'\.css"|"/'${page_name}'/'${page_name}'.css"|g' \
                    -e 's|"'${page_name}'\.js"|"/'${page_name}'/'${page_name}'.js"|g' \
                    "$html_file" > "${BUILD_DIR}/${page_name}/index.html"
                [ -f "${page_dir}${page_name}.css" ] && cp "${page_dir}${page_name}.css" "${BUILD_DIR}/${page_name}/"
                [ -f "${page_dir}${page_name}.js" ] && cp "${page_dir}${page_name}.js" "${BUILD_DIR}/${page_name}/"
              fi
            fi
          done
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          echo "Build output verified: dist directory exists"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Fetch API keys from Parameter Store
        run: |
          PARAM_VALUE=$(aws ssm get-parameter --name "${{ secrets.KAKAO_MAP_PARAM_NAME }}" --with-decryption --query "Parameter.Value" --output text --region ${{ secrets.AWS_REGION }} 2>/dev/null || echo "")
          if [ -z "$PARAM_VALUE" ] || [ "$PARAM_VALUE" == "None" ]; then
            echo "Error: KAKAO_MAP_JAVASCRIPT_KEY not found"
            exit 1
          fi
          echo "::add-mask::$PARAM_VALUE"
          echo "KAKAO_MAP_JAVASCRIPT_KEY=$PARAM_VALUE" >> $GITHUB_ENV
      - name: Build and upload to S3
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BASE_URL: ${{ secrets.CLOUDFRONT_URL }}
        run: |
          set -e
          BUILD_DIR="dist"
          rm -rf ${BUILD_DIR}
          mkdir -p ${BUILD_DIR}
          [ ! -d "public" ] && echo "Error: public directory not found" && exit 1
          cp -r public/* ${BUILD_DIR}/
          
          find ${BUILD_DIR} -type f \( -name ".DS_Store" -o -name "Thumbs.db" -o -name "*.swp" -o -name "*.swo" -o -name "*.bak" \) -delete
          find ${BUILD_DIR} -type d \( -name ".git" -o -name "__pycache__" -o -name ".vscode" -o -name ".idea" \) -exec rm -rf {} + 2>/dev/null || true
          
          if [ -f "${BUILD_DIR}/pages/pool-finder/pool-finder.js" ]; then
            if [ -n "${KAKAO_MAP_JAVASCRIPT_KEY}" ]; then
              sed -i "s|'{{KAKAO_MAP_JAVASCRIPT_KEY}}'|'${KAKAO_MAP_JAVASCRIPT_KEY}'|g" "${BUILD_DIR}/pages/pool-finder/pool-finder.js"
            else
              sed -i "s|'{{KAKAO_MAP_JAVASCRIPT_KEY}}'|''|g" "${BUILD_DIR}/pages/pool-finder/pool-finder.js"
            fi
          fi
          
          cat > ${BUILD_DIR}/config.js <<EOF
          window.APP_CONFIG = {
            KAKAO_MAP_JAVASCRIPT_KEY: "${KAKAO_MAP_JAVASCRIPT_KEY:-}",
            BASE_URL: "${BASE_URL:-}"
          };
          EOF
          
          find ${BUILD_DIR}/pages -name "*.html" -type f | while read htmlfile; do
            if ! grep -q "config.js" "$htmlfile"; then
              sed -i '/<\/head>/i\    <script src="/config.js"></script>' "$htmlfile"
            fi
          done
          
          cat > ${BUILD_DIR}/index.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Community</title>
              <script src="/config.js"></script>
          </head>
          <body>
              <script>window.location.href = '/home';</script>
          </body>
          </html>
          EOF
          
          cat > ${BUILD_DIR}/error.html <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>404</title>
              <script src="/config.js"></script>
          </head>
          <body>
              <h1>404 - Page Not Found</h1>
              <a href="/home">Go to Home</a>
          </body>
          </html>
          EOF
          
          for page_dir in ${BUILD_DIR}/pages/*/; do
            if [ -d "$page_dir" ]; then
              page_name=$(basename "$page_dir")
              html_file="${page_dir}${page_name}.html"
              if [ -f "$html_file" ]; then
                mkdir -p "${BUILD_DIR}/${page_name}"
                sed -e 's|href="/pages/'"${page_name}"'/|href="/'"${page_name}"'/|g' \
                    -e 's|src="/pages/'"${page_name}"'/|src="/'"${page_name}"'/|g' \
                    -e 's|href="\.\./\.\./|href="/|g' \
                    -e 's|src="\.\./\.\./|src="/|g' \
                    -e 's|href="\.\./|href="/|g' \
                    -e 's|src="\.\./|src="/|g' \
                    -e 's|"'${page_name}'\.css"|"/'${page_name}'/'${page_name}'.css"|g' \
                    -e 's|"'${page_name}'\.js"|"/'${page_name}'/'${page_name}'.js"|g' \
                    "$html_file" > "${BUILD_DIR}/${page_name}/index.html"
                [ -f "${page_dir}${page_name}.css" ] && cp "${page_dir}${page_name}.css" "${BUILD_DIR}/${page_name}/"
                [ -f "${page_dir}${page_name}.js" ] && cp "${page_dir}${page_name}.js" "${BUILD_DIR}/${page_name}/"
              fi
            fi
          done
          
          aws s3 sync ${BUILD_DIR}/ s3://${S3_BUCKET_NAME}/ \
            --region ${AWS_REGION} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "config.js" \
            --exclude "*.map" \
            --exclude "assets/**" \
            --exclude ".DS_Store" \
            --exclude "**/.DS_Store" \
            --exclude "Thumbs.db" \
            --exclude "**/Thumbs.db" \
            --exclude "*.swp" \
            --exclude "*.swo" \
            --exclude "*.bak" \
            --exclude ".git/**" \
            --exclude "__pycache__/**" \
            --exclude ".vscode/**" \
            --exclude ".idea/**" || exit 1
          
          if [ -d "${BUILD_DIR}/assets/animations" ]; then
            aws s3 sync ${BUILD_DIR}/assets/animations/ s3://${S3_BUCKET_NAME}/assets/animations/ \
              --region ${AWS_REGION} \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude ".DS_Store" \
              --exclude "**/.DS_Store" || true
          fi
          
          aws s3 sync ${BUILD_DIR}/ s3://${S3_BUCKET_NAME}/ \
            --region ${AWS_REGION} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "config.js" \
            --exclude ".DS_Store" \
            --exclude "**/.DS_Store" \
            --exclude "Thumbs.db" \
            --exclude "**/Thumbs.db" || exit 1
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --region ${{ secrets.AWS_REGION }}
